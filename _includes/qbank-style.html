<style>
.ip-deck { font-size: 1.04rem; color: #4a5158; border-left: 3px solid #c8d4da; padding-left: 1em; margin: 0 0 1.2em; }
.ip-meta { font-size: .85rem; color: #7a8189; margin: 0 0 1.4em; }
.ip-links { margin: 0 0 2em; }
.ip-links a, .ip-back {
  display: inline-block; font-size: .85rem; padding: .3em .85em; margin: 0 .4em .4em 0;
  border: 1px solid #dde3e7; border-radius: 14px; text-decoration: none; color: #41606e; background: #f6f9fa;
}
.ip-links a:hover, .ip-back:hover { background: #eaf1f4; border-color: #c3d2d9; text-decoration: none; }

.ip h2 {
  margin-top: 2.2em; padding-top: .45em; border-top: 2px solid #eee;
  font-size: 1.3rem; color: #23303a; scroll-margin-top: 24px;
}
.ip h3 { font-size: 1.03rem; margin: 1.5em 0 .4em; color: #35424c; }
.ip p, .ip li { line-height: 1.65; }

table.ip-spec { width: 100%; border-collapse: collapse; font-size: .89rem; margin: 1.2em 0; display: block; overflow-x: auto; }
table.ip-spec th, table.ip-spec td { border: 1px solid #e3e3e3; padding: .5em .7em; text-align: left; vertical-align: top; }
table.ip-spec td:first-child { font-weight: 600; white-space: nowrap; background: #fafbfb; width: 30%; }

/* question bank */
.qb-intro { font-size: .93rem; color: #55606a; margin: .6em 0 1.4em; }
.qb-count {
  display: inline-block; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700;
  color: #7a601b; background: #f8f3e6; border: 1px solid #e8dcc2; border-radius: 11px; padding: .2em .7em; margin-left: .5em;
}
details.qb {
  border: 1px solid #e2e6ea; border-left: 4px solid #1f6f8b; border-radius: 5px;
  background: #fcfcfc; margin-bottom: .7em; scroll-margin-top: 24px;
}
details.qb > summary {
  list-style: none; cursor: pointer; padding: .7em 1em; font-weight: 600; font-size: .99rem;
  color: #24313b; display: flex; align-items: center; gap: .55em; border-radius: 5px;
}
details.qb > summary::-webkit-details-marker { display: none; }
details.qb > summary::before { content: "▸"; color: #9aa4ad; font-size: .85em; transition: transform .15s; }
details.qb[open] > summary::before { transform: rotate(90deg); }
details.qb > summary:hover { background: #f2f7f9; color: #1f6f8b; }
details.qb[open] > summary { border-bottom: 1px solid #eef1f3; color: #1f6f8b; }
details.qb .qb-body { padding: .8em 1em 1em; }
details.qb ol { margin: 0 0 0 1.3em; padding: 0; }
details.qb li { margin-bottom: .55em; font-size: .94rem; line-height: 1.6; }
details.qb li .hint {
  display: block; font-size: .85rem; color: #6b7480; margin-top: .18em; padding-left: .1em;
  border-left: 2px solid #e2e8eb; padding-left: .6em;
}
details.qb.wi { border-left-color: #b83227; }
details.qb.wi > summary:hover, details.qb.wi[open] > summary { color: #a52c22; }
details.qb.gl { border-left-color: #4a6741; }
details.qb.gl > summary:hover, details.qb.gl[open] > summary { color: #3f5a37; }

table.gloss { width: 100%; border-collapse: collapse; font-size: .89rem; }
table.gloss th, table.gloss td { border: 1px solid #e6e9eb; padding: .45em .65em; text-align: left; vertical-align: top; }
table.gloss td:first-child { font-weight: 600; white-space: nowrap; background: #fafbfb; }
table.gloss thead th { background: #f4f7f8; }

.ip-note {
  border: 1px solid #e0e6ea; border-left: 3px solid #8a6d1f; background: #fbf9f2;
  padding: .85em 1.1em; border-radius: 0 4px 4px 0; margin: 1.5em 0; font-size: .92rem; color: #55504a;
}
.ip-foot { margin-top: 2.6em; padding-top: 1em; border-top: 1px solid #eee; font-size: .87rem; color: #7a8189; }

.dgm { width: 100%; height: auto; display: block; overflow: visible; }
.dgm .b  { fill: #e8f1f6; stroke: #1f6f8b; stroke-width: 1.4; }
.dgm .b2 { fill: #fbeae7; stroke: #b83227; stroke-width: 1.4; }
.dgm .b3 { fill: #eaf2e6; stroke: #4a6741; stroke-width: 1.4; }
.dgm .b4 { fill: #f1eef7; stroke: #6b4a8b; stroke-width: 1.4; }
.dgm .bg { fill: #f4f5f6; stroke: #b0b6bd; stroke-width: 1.2; }
.dgm .l  { fill: none; stroke: #6b7480; stroke-width: 1.4; }
.dgm .a  { fill: none; stroke: #6b7480; stroke-width: 1.4; marker-end: url(#ipar); }
.dgm .dl { fill: none; stroke: #9aa2ac; stroke-width: 1.3; stroke-dasharray: 4 3; }
.dgm .t  { font: 600 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2f3640; text-anchor: middle; }
.dgm .ts { font: 500 7.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5a626c; text-anchor: middle; }
figure.fig { margin: 1.5em auto; max-width: 560px; }
figure.fig figcaption { font-size: .8rem; color: #7a8189; text-align: center; margin-top: .5em; line-height: 1.45; }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<marker id="ipar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7480"/></marker>
</defs></svg>
